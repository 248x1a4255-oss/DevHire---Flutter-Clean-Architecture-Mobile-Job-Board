name: devhire_mobile
description: "A production-grade mobile job board application built with Flutter Clean Architecture, BLoC, and Material 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Networking & Dual-Datasource
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local Offline Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI, Fonts & Animation
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
